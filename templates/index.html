<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eye Tracking Experiment</title>
    <style>
        body { margin: 0; overflow: hidden; background: white; font-family: sans-serif; }
        #gazeDot { position: absolute; width: 15px; height: 15px; background: red; border-radius: 50%; pointer-events: none; z-index: 9999; }
        .stim-img {
            position: absolute;
            /* Same visual size for all PNGs via fixed box */
            width: 30vw;
            height: 30vh;
            object-fit: contain; /* preserve aspect without distortion */
            transform: translate(-50%, -50%); /* position by center */
            z-index: 10;
        }
        .calibration-dot {
            width: 20px;
            height: 20px;
            background: blue;
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
        }
        #validationDot {
            width: 24px;
            height: 24px;
            background: #ff6600;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            display: none;
            z-index: 45;
        }
        #instructionOverlay {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border: 2px solid black;
            z-index: 50;
            text-align: center;
        }
        #calibrationValidation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border: 2px solid black;
            padding: 24px;
            z-index: 70;
            width: min(90vw, 460px);
            text-align: center;
            display: none;
        }
        #calibrationValidation button {
            margin-top: 12px;
            font-size: 1rem;
            padding: 0.5rem 1.5rem;
        }
        #fixationCross {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            z-index: 40;
        }
    </style>
</head>
<body>

<div id="gazeDot"></div>
<div id="validationDot"></div>

<div id="calibrationValidation">
    <h2 id="calibrationValidationText"></h2>
    <button id="beginValidation">Start Check</button>
    <button id="retryCalibration" style="display:none;">Recalibrate</button>
    <button id="continueAfterValidation" style="display:none;">Continue</button>
</div>

<div id="welcome" style="position:absolute;top:10%;left:10%;width:80%;text-align:center;z-index:50;">
    <h1>Welcome to the Eye Tracking Experiment</h1>
    <p>Enter Participant ID and Initials:</p>
    <input type="text" id="pid" placeholder="Participant ID"><br><br>
    <input type="text" id="initials" placeholder="Initials"><br><br>
    <p>Age: <input type="number" id="age"> Gender: <input type="text" id="gender"></p>
    <button onclick="startCalibration()">Start Calibration</button>
</div>

<!-- Stimuli Images -->
<div id="experiment" style="display:none;">
    <!-- Colon -->
    <img id="colon1" class="stim-img" src="{{ url_for('static', filename='step1_colon.png') }}">
    <img id="colon2" class="stim-img" src="{{ url_for('static', filename='step2_colon.png') }}">
    <img id="colon3" class="stim-img" src="{{ url_for('static', filename='step3_colon.png') }}">
    <img id="colon4" class="stim-img" src="{{ url_for('static', filename='step4_colon.png') }}">

    <!-- Covid -->
    <img id="covid1" class="stim-img" src="{{ url_for('static', filename='step1_covid.png') }}">
    <img id="covid2" class="stim-img" src="{{ url_for('static', filename='step2_covid.png') }}">
    <img id="covid3" class="stim-img" src="{{ url_for('static', filename='step3_covid.png') }}">
    <img id="covid4" class="stim-img" src="{{ url_for('static', filename='step4_covid.png') }}">
</div>

<!-- Audio files -->
{% for cond in ['colon', 'covid'] %}
  {% for version in ['clear', 'casual'] %}
    {% for step in range(1, 5) %}
      <audio id="{{ cond }}_{{ version }}_{{ step }}" src="{{ url_for('static', filename='best_' + cond + '_step' + step|string + '_' + version + '.wav') }}"></audio>
    {% endfor %}
  {% endfor %}
{% endfor %}

<div id="instructionOverlay" style="display:none;">
    <h2 id="instructionText"></h2>
    <button id="instructionButton" style="margin-top:12px; display:none;">Continue</button>
    <button id="beginButton" style="margin-top:12px; display:none;">Begin Experiment</button>
    <button id="startCovidPractice" style="margin-top:12px; display:none;">Start COVID Practice</button>
    <button id="startColonPractice" style="margin-top:12px; display:none;">Start COLON Practice</button>
    <button id="nextAfterPractice" style="margin-top:12px; display:none;">Continue</button>
</div>

<div id="fixationCross" style="display:none;">+</div>

<script src="{{ url_for('static', filename='webgazer.js') }}"></script>
<script>
const ENABLE_CALIBRATION_VALIDATION = false; // toggle this to show/hide post-calibration check
const GAZE_SMOOTHING_WINDOW = 5; // number of samples to average
const GAZE_LOG_INTERVAL_MS = 50; // minimum milliseconds between saved gaze rows

let trialSets = [];
let currentTrialSet = 0;
let stepIndex = 0; // 0..3 within a trial set
let trialStartTime = null; // ms when audio for current step starts
let gazeData = [];
let trialResults = [];
let demographics = {};
let countdownDuration = 10; // seconds
let isFixating = false;

// Reaction time tracking for current instruction
let currentTargetIndex = null; // 1..4 corresponding to quadrant number
let rtRecorded = false;
let pendingRT = null;
let gazeSmoothingBuffer = [];
let lastSmoothedGaze = null;
let lastGazeLogTime = 0;
let validationSamples = [];
let validationInterval = null;
let validationTimeout = null;

const validationOverlay = document.getElementById('calibrationValidation');
const validationText = document.getElementById('calibrationValidationText');
const validationStartButton = document.getElementById('beginValidation');
const validationRetryButton = document.getElementById('retryCalibration');
const validationContinueButton = document.getElementById('continueAfterValidation');
const validationDot = document.getElementById('validationDot');

// --- Define all trial sets ---
['colon', 'covid'].forEach(type => {
    for (let i = 0; i < 10; i++) {
        trialSets.push({
            type,
            order: shuffle([1, 2, 3, 4]),
            version: Math.random() < 0.5 ? 'clear' : 'casual'
        });
    }
});
trialSets = shuffle(trialSets);

function processGazeSample(sample) {
    if (!sample || typeof sample.x !== 'number' || typeof sample.y !== 'number') {
        return null;
    }
    gazeSmoothingBuffer.push({ x: sample.x, y: sample.y });
    if (gazeSmoothingBuffer.length > GAZE_SMOOTHING_WINDOW) {
        gazeSmoothingBuffer.shift();
    }

    let avgX = 0;
    let avgY = 0;
    gazeSmoothingBuffer.forEach(point => {
        avgX += point.x;
        avgY += point.y;
    });
    avgX /= gazeSmoothingBuffer.length;
    avgY /= gazeSmoothingBuffer.length;

    lastSmoothedGaze = { x: avgX, y: avgY };
    return lastSmoothedGaze;
}

function getCurrentSmoothedGaze() {
    return lastSmoothedGaze;
}

function resetGazeSmoothing() {
    gazeSmoothingBuffer = [];
    lastSmoothedGaze = null;
}

// --- Gaze Listener ---
webgazer.setGazeListener((data, timestamp) => {
    const smoothed = processGazeSample(data);
    if (!smoothed) return;

    const now = Date.now();
    const gazeX = smoothed.x;
    const gazeY = smoothed.y;

    if (trialStartTime !== null && now - lastGazeLogTime >= GAZE_LOG_INTERVAL_MS) {
        gazeData.push({
            trialSet: currentTrialSet,
            step: stepIndex + 1,
            target: currentTargetIndex,
            time: (now - trialStartTime) / 1000,
            x: gazeX,
            y: gazeY
        });
        lastGazeLogTime = now;
    }

    // Detect first entry into the correct image's bounding box to mark RT
    if (trialStartTime !== null && currentTargetIndex && !rtRecorded) {
        const el = getImageElementForTarget(currentTargetIndex);
        if (el) {
            const rect = el.getBoundingClientRect();
            if (gazeX >= rect.left && gazeX <= rect.right && gazeY >= rect.top && gazeY <= rect.bottom) {
                pendingRT = (now - trialStartTime) / 1000;
                rtRecorded = true;
            }
        }
    }
});

// --- Calibration ---
function startCalibration() {
    demographics = {
        pid: document.getElementById('pid').value,
        initials: document.getElementById('initials').value,
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value
    };

    document.getElementById('welcome').style.display = 'none';
    resetGazeSmoothing();
    lastGazeLogTime = 0;
    webgazer.begin().then(() => {
        showCalibrationDots();
    });
}

function showCalibrationDots() {
    resetValidationCapture();
    validationDot.style.display = 'none';
    document.querySelectorAll('.calibration-dot').forEach(dot => dot.remove());
    webgazer.showVideo(true);
    webgazer.showFaceOverlay(true);
    webgazer.showFaceFeedbackBox(true);
    const positions = [
        [5,5],[50,5],[95,5],
        [5,50],[50,50],[95,50],
        [5,95],[50,95],[95,95]
    ];
    let clicked = 0;
    positions.forEach(pos => {
        const dot = document.createElement('div');
        dot.className = 'calibration-dot';
        dot.style.left = pos[0] + 'vw';
        dot.style.top = pos[1] + 'vh';
        dot.onclick = () => {
            dot.style.background = 'gray';
            clicked++;
            if (clicked === 9) finishCalibration();
        };
        document.body.appendChild(dot);
    });
}

function finishCalibration() {
    document.querySelectorAll('.calibration-dot').forEach(dot => dot.remove());
    webgazer.showVideo(false);
    webgazer.showFaceOverlay(false);
    webgazer.showFaceFeedbackBox(false);
    if (ENABLE_CALIBRATION_VALIDATION) {
        startCalibrationValidation();
    } else {
        startPractice();
    }
}

function startCalibrationValidation() {
    if (!ENABLE_CALIBRATION_VALIDATION) return;
    resetValidationCapture();
    validationSamples = [];
    validationText.textContent = 'Calibration check: click Start Check and keep your eyes on the orange dot.';
    validationStartButton.textContent = 'Start Check';
    validationStartButton.style.display = 'inline-block';
    validationRetryButton.style.display = 'none';
    validationContinueButton.style.display = 'none';
    validationOverlay.style.display = 'block';
}

function runCalibrationValidation() {
    resetValidationCapture();
    validationSamples = [];
    validationDot.style.display = 'block';

    validationInterval = setInterval(() => {
        const prediction = getCurrentSmoothedGaze() || webgazer.getCurrentPrediction();
        if (prediction && typeof prediction.x === 'number' && typeof prediction.y === 'number') {
            validationSamples.push({ x: prediction.x, y: prediction.y });
        }
    }, 100);

    validationTimeout = setTimeout(() => {
        const targetRect = validationDot.getBoundingClientRect();
        resetValidationCapture();
        validationDot.style.display = 'none';
        evaluateCalibrationValidation(targetRect);
    }, 1200);
}

function evaluateCalibrationValidation(targetRect) {
    const count = validationSamples.length;
    let avgX = 0;
    let avgY = 0;

    if (count > 0) {
        validationSamples.forEach(sample => {
            avgX += sample.x;
            avgY += sample.y;
        });
        avgX /= count;
        avgY /= count;
    }

    const targetX = targetRect.left + targetRect.width / 2;
    const targetY = targetRect.top + targetRect.height / 2;
    const distance = count > 0 ? Math.hypot(avgX - targetX, avgY - targetY) : Infinity;
    const threshold = 120;

    if (count > 0 && distance <= threshold) {
        validationText.textContent = 'Nice! Calibration looks accurate. Click Continue to move on.';
        validationStartButton.style.display = 'none';
        validationRetryButton.style.display = 'none';
        validationContinueButton.style.display = 'inline-block';
    } else {
        validationText.textContent = 'Tracking looks off. Try the check again or redo the 9-point calibration.';
        validationStartButton.textContent = 'Try Again';
        validationStartButton.style.display = 'inline-block';
        validationRetryButton.style.display = 'inline-block';
        validationContinueButton.style.display = 'none';
    }

    validationOverlay.style.display = 'block';
    validationSamples = [];
}

function resetValidationCapture() {
    if (validationInterval) {
        clearInterval(validationInterval);
        validationInterval = null;
    }
    if (validationTimeout) {
        clearTimeout(validationTimeout);
        validationTimeout = null;
    }
}

if (validationStartButton && validationRetryButton && validationContinueButton) {
    validationStartButton.addEventListener('click', () => {
        validationOverlay.style.display = 'none';
        runCalibrationValidation();
    });

    validationRetryButton.addEventListener('click', () => {
        validationOverlay.style.display = 'none';
        showCalibrationDots();
    });

    validationContinueButton.addEventListener('click', () => {
        validationOverlay.style.display = 'none';
        startPractice();
    });
}

// --- Trial Set ---
function startTrialSet() {
    if (currentTrialSet >= trialSets.length) return endExperiment();

    const trial = trialSets[currentTrialSet];
    stepIndex = 0;
    currentTargetIndex = null;
    rtRecorded = false;
    pendingRT = null;

    document.getElementById('experiment').style.display = 'block';
    showImages(trial.type); // show images fixed in quadrants

    // Play randomized sentences for this trial's version
    playNextAudio();
}

function playNextAudio() {
    const trial = trialSets[currentTrialSet];
    const target = trial.order[stepIndex]; // 1..4
    const audioId = `${trial.type}_${trial.version}_${target}`;
    const audio = document.getElementById(audioId);

    // initialize per-step tracking
    resetGazeSmoothing();
    lastGazeLogTime = 0;
    trialStartTime = Date.now();
    currentTargetIndex = target;
    rtRecorded = false;
    pendingRT = null;

    audio.play();
    stepIndex++;

    audio.onended = () => {
        // finalize per-step result
        const success = rtRecorded && pendingRT !== null;
        const rt = success ? pendingRT : null;
        const t = trialSets[currentTrialSet];
        trialResults.push({
            trialSet: currentTrialSet,
            orderIndex: stepIndex, // 1..4 position in sequence
            target: target,        // picture number 1..4
            type: t.type,          // 'colon' or 'covid'
            version: t.version,    // 'clear' or 'casual'
            rt: rt,
            success: success
        });

        // reset step timing state
        trialStartTime = null;
        currentTargetIndex = null;
        rtRecorded = false;
        pendingRT = null;

        if (stepIndex < 4) {
            setTimeout(() => {
                playNextAudio();
            }, 500);
        } else {
            // End of this trial set: hide images, then show fixation cross for 2s
            hideImages();
            showFixation(() => {
                currentTrialSet++;
                setTimeout(() => {
                    startTrialSet();
                }, 200);
            });
        }
    };
}

// --- Stimulus Image Control ---
function showImages(type) {
    ['colon', 'covid'].forEach(t => {
        for (let i = 1; i <= 4; i++) {
            const el = document.getElementById(`${t}${i}`);
            el.style.display = (t === type) ? 'block' : 'none';
        }
    });

    // Center each image in the four quadrants (equal spacing)
    const positions = [
        [25, 25], // top-left quadrant center
        [75, 25], // top-right quadrant center
        [25, 75], // bottom-left quadrant center
        [75, 75]  // bottom-right quadrant center
    ];
    for (let i = 1; i <= 4; i++) {
        const el = document.getElementById(`${type}${i}`);
        el.style.left = positions[i - 1][0] + 'vw';
        el.style.top = positions[i - 1][1] + 'vh';
    }
}

function hideImages() {
    ['colon', 'covid'].forEach(t => {
        for (let i = 1; i <= 4; i++) {
            const el = document.getElementById(`${t}${i}`);
            el.style.display = 'none';
        }
    });
}

// Practice and instruction screens
function startPractice() {
    const overlay = document.getElementById('instructionOverlay');
    const text = document.getElementById('instructionText');
    const btnCovid = document.getElementById('startCovidPractice');
    const btnColon = document.getElementById('startColonPractice');
    const btnBegin = document.getElementById('beginButton');

    function resetButtons() {
        btnCovid.style.display = 'none';
        btnColon.style.display = 'none';
        btnBegin.style.display = 'none';
    }

    overlay.style.display = 'block';
    text.textContent = 'Practice: You will be shown the COVID pictures in order (1=top-left, 2=top-right, 3=bottom-left, 4=bottom-right) with their sentences.';
    resetButtons();
    btnCovid.style.display = 'inline-block';

    btnCovid.onclick = () => {
        resetButtons();
        overlay.style.display = 'none';
        runPractice('covid', () => {
            overlay.style.display = 'block';
            text.textContent = 'Now the COLON pictures will be shown in order with their sentences.';
            resetButtons();
            btnColon.style.display = 'inline-block';
        });
    };

    btnColon.onclick = () => {
        resetButtons();
        overlay.style.display = 'none';
        runPractice('colon', () => {
            overlay.style.display = 'block';
            text.textContent = 'Instructions: You will hear sentences. Use your eyes only to look at the matching picture (1=TL, 2=TR, 3=BL, 4=BR). A + cross will appear for 2 seconds after each trial; fixate on it.';
            resetButtons();
            btnBegin.style.display = 'inline-block';
        });
    };

    btnBegin.onclick = () => {
        overlay.style.display = 'none';
        startTrialSet();
    };
}

function runPractice(type, done) {
    document.getElementById('experiment').style.display = 'block';
    showImages(type);
    let i = 1;
    function playNext() {
        if (i > 4) {
            hideImages();
            if (typeof done === 'function') done();
            return;
        }
        const audio = document.getElementById(`${type}_clear_${i}`); // use clear for practice
        audio.onended = () => {
            i++;
            setTimeout(playNext, 400);
        };
        audio.play();
    }
    playNext();
}

// --- Fixation ---
function showFixation(callback) {
    const cross = document.getElementById('fixationCross');
    cross.style.display = 'block';
    setTimeout(() => {
        cross.style.display = 'none';
        callback();
    }, 2000);
}

// --- End ---
function endExperiment() {
    fetch('/save_gaze', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ demographics, gaze: gazeData, results: trialResults })
    }).then(() => {
        alert("Thanks for participating! Data saved.");
    });
}

function shuffle(arr) {
    return arr.sort(() => Math.random() - 0.5);
}

function getImageElementForTarget(n) {
    // When a trial is active, only one type is visible
    const t = trialSets[currentTrialSet]?.type || 'covid';
    return document.getElementById(`${t}${n}`);
}
</script>
</body>
</html>
